version: "3.8"

services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  api:
    image: 519607954543.dkr.ecr.ap-south-1.amazonaws.com/devops-test-api:api
    container_name: api
    environment:
      - REDIS_HOST=redis:6379
    depends_on:
      - redis
    ports:
      - "8080:8080"

  frontend:
    image: 519607954543.dkr.ecr.ap-south-1.amazonaws.com/devops-test-api:app
    container_name: frontend
    depends_on:
      - api
    ports:
      - "3000:80"
